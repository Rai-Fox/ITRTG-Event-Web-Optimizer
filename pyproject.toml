[project]
name = "itrtg-web-optimizer"
version = "0.1.0"
description = "Local ITRTG optimizer web app backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pillow>=11.0.0",
    "winsdk==1.0.0b10; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
